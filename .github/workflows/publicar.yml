name: publicar

on:
  schedule:
    # a cada 15 min, fora da virada da hora (GitHub atrasa mais nos :00)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar (normal) ou verificar (so confere as chaves)"
        default: publicar
        type: choice
        options: [publicar, verificar]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/publicar.mjs
        env:
          MODO: ${{ inputs.modo || 'publicar' }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          IG_TOKEN_VILLA: ${{ secrets.IG_TOKEN_VILLA }}
          IG_TOKEN_ATP: ${{ secrets.IG_TOKEN_ATP }}
          IG_TOKEN_PLUGIN: ${{ secrets.IG_TOKEN_PLUGIN }}
      - name: salvar status
        run: |
          git config user.name "publicador-bot"
          git config user.email "publicador-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "status dos posts" && git push)
